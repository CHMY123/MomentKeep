spring:
  application:
    name: MomentKeep
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:mysql://gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com:4000/momentkeep?sslMode=VERIFY_IDENTITY
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.TiDBDialect
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: cn.edu.scnu.momentkeep.entity
  configuration:
    map-underscore-to-camel-case: true

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY}
    url: https://api.deepseek.com

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  expiration:
    time: 86400000

s3:
  accessKey: ${S3_ACCESS_KEY}
  secretKey: ${S3_SECRET_KEY}
  bucketName: momentkeep
  endpoint: https://s3.bitiful.net
  region: cn-east-1

logging:
  level:
    cn.edu.scnu.momentkeep: info