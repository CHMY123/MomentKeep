services:
  - type: web
    name: momentkeep-backend
    runtime: docker
    # 关键修复：指定 Docker 构建的上下文目录（包含 pom.xml 的目录）
    dockerContextPath: ./backend/MomentKeep
    # Dockerfile 路径（相对于仓库根目录）
    dockerfilePath: ./backend/MomentKeep/Dockerfile
    # 可选：指定工作目录
    rootDir: ./backend/MomentKeep
    region: singapore
    plan: free
    healthCheckPath: /api/user/profile
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRATION_TIME
        value: "86400000"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_URL
        value: https://api.deepseek.com
      - key: BINFENGYUN_ACCESS_KEY
        sync: false
      - key: BINFENGYUN_SECRET_KEY
        sync: false
      - key: BINFENGYUN_BUCKET_NAME
        value: momentkeep
      - key: BINFENGYUN_ENDPOINT
        value: https://s3.bitiful.net