# Render 部署配置文件
# https://render.com/docs/deploy-to-render

services:
  - type: web
    name: momentkeep-backend
    runtime: docker
    dockerfilePath: ./backend/MomentKeep/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/user/profile
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRATION_TIME
        value: "86400000"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_URL
        value: https://api.deepseek.com
      - key: BINFENGYUN_ACCESS_KEY
        sync: false
      - key: BINFENGYUN_SECRET_KEY
        sync: false
      - key: BINFENGYUN_BUCKET_NAME
        value: momentkeep
      - key: BINFENGYUN_ENDPOINT
        value: https://s3.bitiful.net
